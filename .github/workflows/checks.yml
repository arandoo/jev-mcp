name: checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Single stable context for branch protection: requiring the matrix directly
  # would mean naming all 9 jobs, and any matrix change would silently break
  # the rule.
  all-green:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "matrix result: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ] || exit 1
