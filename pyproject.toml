[project]
name = "jev-mcp"
version = "0.1.0"
description = "MCP server exposing TypeSafe AI's Jev decision model to Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pillow>=10",
]

[project.scripts]
jev-mcp = "jev_mcp.server:main"
jev-reframe = "jev_mcp.reframe:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_mcp"]
